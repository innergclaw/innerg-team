name: Refresh data
on:
  schedule: [{ cron: "*/20 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: refresh
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-data.mjs
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", PRIVATE_REPOS: "${{ secrets.PRIVATE_REPOS }}" }
      - run: |
          git config user.name "innerg-team-bot"; git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || { git commit -m "Refresh data.json"; git push; }
